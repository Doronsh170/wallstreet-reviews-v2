<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>לוח הבקרה — Market Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6; --card:#FFFFFF; --ink:#12202F; --ink-soft:#42546A;
  --muted:#7A8699; --line:#E4E1D7; --brass:#A98735; --desk:#0E3A46;
  --desk-soft:#EAF2F3; --up:#0E7C5B; --danger:#B4452F;
}
*{box-sizing:border-box}
html,body{direction:rtl;text-align:right}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Heebo',Arial,'Noto Sans Hebrew',sans-serif;
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}

.masthead{padding:26px 0 14px;text-align:center;border-bottom:2px solid var(--brass);margin-bottom:22px}
.masthead .kicker{font-size:12px;letter-spacing:.25em;color:var(--brass);font-weight:700}
.masthead h1{margin:6px 0 0;font-size:26px;font-weight:900;letter-spacing:-.01em}
.masthead a{color:var(--muted);font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--line)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 20px;margin-bottom:16px;
}
.card[data-off]{opacity:.45;pointer-events:none}
.card h2{
  margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.1em;
  color:var(--muted);display:flex;align-items:center;gap:8px;
}
.card h2 .n{
  background:var(--desk);color:#fff;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;letter-spacing:0;flex:none;
}

/* ── choice rows ── */
.row{display:grid;gap:8px;margin-bottom:12px}
.row.two{grid-template-columns:1fr 1fr}
.row.three{grid-template-columns:repeat(3,1fr)}
.opt{
  appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:13px 6px;font:inherit;font-weight:500;cursor:pointer;
  text-align:center;line-height:1.3;transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--desk)}
.opt[aria-pressed="true"]{background:var(--desk);border-color:var(--desk);color:#fff;font-weight:700}
.opt:disabled{opacity:.34;cursor:not-allowed}
.opt .flag{display:block;font-size:20px;line-height:1.5}
.row.three .opt{font-size:15.5px;padding:12px 4px}

.go{
  width:100%;border:0;border-radius:11px;padding:15px;font:inherit;font-weight:700;
  font-size:17px;background:var(--desk);color:#fff;cursor:pointer;transition:.12s;
}
.go:hover:not(:disabled){filter:brightness(1.12)}
.go:disabled{opacity:.5;cursor:not-allowed}
.go.ghost{background:#fff;color:var(--desk);border:1.5px solid var(--desk)}
.go.good{background:var(--up)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}

textarea{
  width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:11px;
  padding:12px;font:inherit;font-size:15px;line-height:1.6;background:#fff;color:var(--ink);
  resize:vertical;direction:ltr;text-align:left;
}
textarea:focus{outline:none;border-color:var(--desk)}
input[type=text],input[type=password]{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink);margin-bottom:9px;
  direction:ltr;text-align:left;
}
label{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:500;margin-bottom:3px;text-align:right}

.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.ready{
  background:var(--desk-soft);border-radius:11px;padding:12px 14px;margin-bottom:13px;
  font-size:15px;line-height:1.55;
}
.ready b{display:block;font-size:16px}

/* ── status ── */
.status{border-radius:11px;padding:13px 15px;margin-top:13px;font-size:15.5px;display:none}
.status.on{display:block}
.status.work{background:var(--desk-soft);color:var(--desk)}
.status.ok{background:#E7F4EE;color:var(--up);font-weight:600}
.status.bad{background:#FBEDEA;color:var(--danger)}
.status .detail{
  display:block;margin-top:7px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;
  opacity:.92;direction:ltr;text-align:left;
}
.spin{
  display:inline-block;width:13px;height:13px;margin-left:8px;vertical-align:-1px;
  border:2px solid currentColor;border-top-color:transparent;border-radius:50%;
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;background:rgba(14,58,70,.14);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--desk);width:0;transition:width .9s linear}

.setup{border-color:var(--brass);background:#FFFDF6}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0}
.foot{text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="kicker">MARKET DESK</div>
    <h1>לוח הבקרה</h1>
    <a href="index.html">← לאתר הסקירות</a>
  </header>

  <!-- one-time setup -->
  <section class="card setup" id="setupCard" hidden>
    <h2><span class="n">⚙</span> חיבור ראשוני</h2>
    <label for="wurl">כתובת השרת</label>
    <input type="text" id="wurl" placeholder="https://market-desk-admin.workers.dev" autocomplete="off">
    <label for="wpass">סיסמה</label>
    <input type="password" id="wpass" placeholder="הסיסמה שהגדרת" autocomplete="current-password">
    <button class="go" id="saveSetup" type="button">שמור והתחל</button>
    <p class="note">נשמר במכשיר הזה בלבד. אין כאן טוקן של GitHub.</p>
  </section>

  <!-- 1 · choose -->
  <section class="card" id="chooseCard">
    <h2><span class="n">1</span> בחירת סקירה</h2>
    <div class="row two" id="marketRow">
      <button class="opt" type="button" data-market="us" aria-pressed="true"><span class="flag">🇺🇸</span>וול סטריט</button>
      <button class="opt" type="button" data-market="il" aria-pressed="false"><span class="flag">🇮🇱</span>ישראל</button>
    </div>
    <div class="row three" id="kindRow">
      <button class="opt" type="button" data-kind="prep" aria-pressed="true">בוקר</button>
      <button class="opt" type="button" data-kind="intraday" aria-pressed="false">תוך יומי</button>
      <button class="opt" type="button" data-kind="close" aria-pressed="false">סגירה</button>
      <button class="opt" type="button" data-kind="weeklySummary" aria-pressed="false">סיכום שבוע</button>
      <button class="opt" type="button" data-kind="weeklyPrep" aria-pressed="false">הכנה לשבוע</button>
    </div>
    <button class="go" id="gatherBtn" type="button">אסוף חומר גלם</button>
    <div class="status" id="gatherStatus"><span id="gatherMsg"></span><div class="bar" id="gatherBar" hidden><i></i></div></div>
  </section>

  <!-- 2 · hand to the model -->
  <section class="card" id="chatCard" data-off>
    <h2><span class="n">2</span> כתיבה בצ'אט</h2>
    <div class="ready" id="readyBox"><b>ממתין לאיסוף</b><span>אחרי האיסוף אפשר יהיה להעתיק את החומר בלחיצה אחת.</span></div>
    <div class="pair">
      <button class="go" id="copyBtn" type="button">העתק חומר</button>
      <button class="go ghost" id="openBtn" type="button">פתח את Claude</button>
    </div>
    <p class="note">מדביקים בצ'אט, ומעתיקים משם את התשובה.</p>
  </section>

  <!-- 3 · publish -->
  <section class="card" id="publishCard" data-off>
    <h2><span class="n">3</span> פרסום</h2>
    <textarea id="paste" placeholder="הדבק כאן את תשובת הצ'אט" spellcheck="false"></textarea>
    <button class="go" id="publishBtn" type="button" style="margin-top:11px">פרסם</button>
    <div class="status" id="pubStatus"><span id="pubMsg"></span></div>
  </section>

  <div class="foot"><button class="linkbtn" id="resetSetup" type="button">החלפת חיבור</button></div>
</div>

<script>
// ── config kept on this device only ────────────────────────────────
const CFG = {
  get url(){ return (localStorage.getItem('md.url') || '').replace(/\/+$/,''); },
  get pass(){ return localStorage.getItem('md.pass') || ''; },
  set(url, pass){ localStorage.setItem('md.url', url); localStorage.setItem('md.pass', pass); },
  clear(){ localStorage.removeItem('md.url'); localStorage.removeItem('md.pass'); },
  get ok(){ return Boolean(this.url && this.pass); }
};

// The four buttons map onto the pipeline's mode names. Tel Aviv has no intraday
// review, so that button is disabled rather than silently doing something else.
const MODES = {
  us: { prep:'daily_prep',  intraday:'intraday_update', close:'daily_summary',
        weeklySummary:'weekly_summary',        weeklyPrep:'weekly_prep' },
  il: { prep:'israel_prep', intraday:null,              close:'israel_summary',
        weeklySummary:'israel_weekly_summary', weeklyPrep:'israel_weekly_prep' }
};
const LABEL = {prep:'בוקר', intraday:'תוך יומי', close:'סגירה',
               weeklySummary:'סיכום שבוע', weeklyPrep:'הכנה לשבוע'};

let market = localStorage.getItem('md.market') || 'us';
let kind   = localStorage.getItem('md.kind')   || 'prep';
if(!(kind in LABEL)) kind = 'prep';   // an old stored "weekly" predates the split
let material = '';       // the gathered prompt, held in memory for the copy button
let publishAfter = null; // run id that was newest before we committed

const $ = id => document.getElementById(id);

// ── server calls ───────────────────────────────────────────────────
async function api(path, options = {}){
  const r = await fetch(CFG.url + path, {
    ...options,
    headers: {'Authorization':'Bearer ' + CFG.pass, 'Content-Type':'application/json', ...(options.headers||{})}
  });
  let body = {};
  try { body = await r.json(); } catch { /* keep {} */ }
  if(!r.ok){
    if(r.status === 401) throw new Error('הסיסמה שגויה. לחץ "החלפת חיבור" למטה.');
    throw new Error(body.error || ('השרת החזיר שגיאה ' + r.status));
  }
  return body;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/** Polls a workflow until it finishes. Returns 'success' or throws. */
async function awaitRun(workflow, after, onTick, budgetMs){
  const started = Date.now();
  while(Date.now() - started < budgetMs){
    await wait(5000);
    onTick(Math.round((Date.now() - started)/1000));
    let s;
    try {
      s = await api(`/status?workflow=${workflow}` + (after ? `&after=${after}` : ''));
    } catch(e){
      continue;  // a transient blip should not abort a run that is still going
    }
    if(s.state === 'success') return s;
    if(s.state === 'failure') throw new Error('הריצה נכשלה בשרת.');
  }
  throw new Error('הפעולה לוקחת יותר מדי זמן. נסה שוב בעוד רגע.');
}

// ── status helpers ─────────────────────────────────────────────────
function setStatus(box, msgEl, kindName, html){
  box.className = 'status on ' + kindName;
  msgEl.innerHTML = html;
}
function clearStatus(box){ box.className = 'status'; }

// ── 1 · gather ─────────────────────────────────────────────────────
function currentMode(){ return MODES[market][kind]; }

function paintChoices(){
  document.querySelectorAll('#marketRow .opt').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.market === market)));
  document.querySelectorAll('#kindRow .opt').forEach(b => {
    const available = Boolean(MODES[market][b.dataset.kind]);
    b.disabled = !available;
    b.title = available ? '' : 'אין עדכון תוך-יומי לתל אביב';
    b.setAttribute('aria-pressed', String(available && b.dataset.kind === kind));
  });
  $('gatherBtn').disabled = !currentMode();
}

$('marketRow').addEventListener('click', e => {
  const b = e.target.closest('[data-market]'); if(!b) return;
  market = b.dataset.market;
  if(!MODES[market][kind]) kind = 'prep';   // Israel has no intraday — fall back
  localStorage.setItem('md.market', market);
  localStorage.setItem('md.kind', kind);
  paintChoices();
});

$('kindRow').addEventListener('click', e => {
  const b = e.target.closest('[data-kind]'); if(!b || b.disabled) return;
  kind = b.dataset.kind;
  localStorage.setItem('md.kind', kind);
  paintChoices();
});

$('gatherBtn').addEventListener('click', async () => {
  const mode = currentMode();
  if(!mode) return;
  const btn = $('gatherBtn'), box = $('gatherStatus'), msg = $('gatherMsg'), bar = $('gatherBar');
  btn.disabled = true;
  $('chatCard').setAttribute('data-off','');
  $('publishCard').setAttribute('data-off','');
  bar.hidden = false; bar.firstElementChild.style.width = '0';
  setStatus(box, msg, 'work', 'אוסף חומר גלם<span class="spin"></span>');

  try {
    const {after} = await api('/gather', {method:'POST', body: JSON.stringify({mode})});
    await awaitRun('gather', after, secs => {
      setStatus(box, msg, 'work', `אוסף חומר גלם — ${secs} שניות<span class="spin"></span>`);
      bar.firstElementChild.style.width = Math.min(95, secs / 1.8) + '%';
    }, 8*60*1000);

    const data = await api('/raw');
    material = data.content || '';
    bar.firstElementChild.style.width = '100%';
    setStatus(box, msg, 'ok', 'החומר מוכן ✓');
    $('readyBox').innerHTML = `<b>${escapeHtml(data.title || 'החומר מוכן')}</b>
      <span>${LABEL[kind]} · ${market === 'us' ? 'וול סטריט' : 'תל אביב'}</span>`;
    $('chatCard').removeAttribute('data-off');
    $('publishCard').removeAttribute('data-off');
    $('chatCard').scrollIntoView({behavior:'smooth', block:'center'});
  } catch(err){
    bar.hidden = true;
    setStatus(box, msg, 'bad', 'האיסוף נכשל.<span class="detail">' + escapeHtml(err.message) + '</span>');
  } finally {
    btn.disabled = false;
  }
});

// ── 2 · hand over ──────────────────────────────────────────────────
async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Older mobile browsers refuse the async clipboard; fall back to a selection copy.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

$('copyBtn').addEventListener('click', async () => {
  const btn = $('copyBtn');
  if(!material){ btn.textContent = 'אין חומר — אסוף קודם'; return; }
  const ok = await copyText(material);
  btn.textContent = ok ? 'הועתק ✓' : 'ההעתקה נכשלה';
  setTimeout(() => { btn.textContent = 'העתק חומר'; }, 2200);
});

$('openBtn').addEventListener('click', () => window.open('https://claude.ai/new', '_blank', 'noopener'));

// ── 3 · publish ────────────────────────────────────────────────────
/** The publish verdict paste_review.py wrote, once it is newer than `before`. */
async function freshResult(before){
  for(let i = 0; i < 5; i++){
    try {
      const r = await api('/result');
      if(r && r.finishedAt && r.finishedAt !== before) return r;
    } catch { /* keep trying */ }
    await wait(2500);
  }
  return null;
}

$('publishBtn').addEventListener('click', async () => {
  const text = $('paste').value.trim();
  const btn = $('publishBtn'), box = $('pubStatus'), msg = $('pubMsg');
  if(!text){ setStatus(box, msg, 'bad', 'אין מה לפרסם — הדבק קודם את תשובת הצ׳אט.'); return; }
  btn.disabled = true;
  setStatus(box, msg, 'work', 'מאמת ומפרסם<span class="spin"></span>');

  // Remember the previous verdict so a stale one is never read back as this run's.
  let before = null;
  try { before = (await api('/result')).finishedAt || null; } catch { /* first run */ }

  try {
    const {after} = await api('/publish', {method:'POST', body: JSON.stringify({content: text})});
    publishAfter = after;
    await awaitRun('publish', after, secs => {
      setStatus(box, msg, 'work', `מאמת ומפרסם — ${secs} שניות<span class="spin"></span>`);
    }, 6*60*1000);
    const verdict = await freshResult(before);
    const title = verdict && verdict.title ? '<span class="detail">' + escapeHtml(verdict.title) + '</span>' : '';
    setStatus(box, msg, 'ok', 'הסקירה באוויר ✓ <a href="index.html">פתח את האתר</a>' + title);
  } catch(err){
    // A guard rejection has a Hebrew explanation of what to fix; show that, not the
    // generic "the run failed". The pasted text stays put so it can be corrected.
    const verdict = await freshResult(before);
    const reason = verdict && verdict.error ? verdict.error : err.message;
    setStatus(box, msg, 'bad',
      'הסקירה לא פורסמה — יש לתקן בצ׳אט ולהדביק שוב.<span class="detail">' + escapeHtml(reason) + '</span>');
  } finally {
    btn.disabled = false;
  }
});

// ── setup ──────────────────────────────────────────────────────────
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showSetup(show){
  $('setupCard').hidden = !show;
  ['chooseCard','chatCard','publishCard'].forEach(id => { $(id).hidden = show; });
}

$('saveSetup').addEventListener('click', () => {
  const url = $('wurl').value.trim(), pass = $('wpass').value;
  if(!url || !pass) return;
  CFG.set(url, pass);
  showSetup(false);
});

$('resetSetup').addEventListener('click', () => {
  CFG.clear();
  $('wurl').value = ''; $('wpass').value = '';
  showSetup(true);
});

paintChoices();
showSetup(!CFG.ok);
</script>
</body>
</html>
